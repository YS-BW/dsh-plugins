# bundle patch：把本插件的插件行插进 profile 的 loader roster。
#
# id 是 loader 内部唯一键，可以短；name 必须是**完整 npm 包名**（带 scope），
# 因为客户端模块表的键就是包名（host 侧 reconcilePackage(packageName)），
# bundle 里注册的 id 必须与之完全一致。
#
# 安装（已发布到 npm）：dsh plugin --profile web add @lixklv/dsh-hello
# 本地开发：dsh plugin --profile web add link:<本仓库>/packages/dsh-hello
- insert:
    - id: dsh-hello
      name: '@lixklv/dsh-hello'
